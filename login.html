
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Login | Kerja Yuk</title>
</head>
<body class="auth-page">

    <nav class="navbar">
        <a href="index.html" class="logo">kerjaYuk<span>.</span></a>
        <a href="register.html" class="nav-button">Create Account</a>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-heading">
                <p class="auth-label">WELCOME BACK</p>
                <h1>Welcome Back!</h1>
                <p>Login to find opportunities that fit your life.</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Login
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </section>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>

</body>
</html>
