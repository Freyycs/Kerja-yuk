
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Kerja Yuk</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page">

    <nav class="navbar">
        <a href="index.html" class="logo">kerjaYuk<span>.</span></a>
        <a href="login.html" class="nav-button">Login</a>
    </nav>

    <main class="auth-container">
        <section class="auth-card register-card">
            <div class="auth-heading">
                <p class="auth-label">JOIN KERJA YUK</p>
                <h1>Create Account</h1>
                <p>Create your student account and discover new opportunities.</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="university">University</label>
                    <input
                        type="text"
                        id="university"
                        placeholder="Enter your university"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <select id="semester" required>
                        <option value="">Choose your semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Create Account
                    </button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>

</body>
</html>
